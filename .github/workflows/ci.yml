name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly: the slow tier and the notebooks against a cached public flight.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ unit
  unit:
    name: unit (py${{ matrix.python }}, ${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
        engine: [torch]
        include:
          # One leg per engine, because the seam is only proven by using it:
          # with all three factories present in one package, a wrapper that
          # silently pins one still passes a torch-only matrix.
          # ModernGL needs a software GL stack, so it runs headless under Xvfb.
          - python: "3.11"
            engine: moderngl
          # Vulkan is the headless GPU path and needs Python >= 3.11.
          - python: "3.11"
            engine: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg
          if [ "${{ matrix.engine }}" = "moderngl" ]; then
            sudo apt-get install -y --no-install-recommends xvfb libegl1 libgles2 mesa-utils
          fi
          if [ "${{ matrix.engine }}" = "vulkan" ]; then
            sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
          fi
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest pytest-cov
      - name: Install alfspy with the ${{ matrix.engine }} engine
        # One package since 3.0; the engine is an extra named after the value
        # that selects it, so the install and $ALFS_ENGINE cannot disagree.
        run: |
          pip install "AlfsPy[${{ matrix.engine }},embree] @ git+https://github.com/bambi-eco/alfs_py.git@v3.0.0"
      - name: Unit tests
        env:
          ALFS_ENGINE: ${{ matrix.engine }}
        run: |
          if [ "${{ matrix.engine }}" = "moderngl" ]; then
            xvfb-run -a pytest -m "not slow and not notebook" --cov=bambi --cov-report=term-missing
          else
            pytest -m "not slow and not notebook" --cov=bambi --cov-report=term-missing
          fi

  # ------------------------------------------------------------ slow + nb
  data:
    name: slow tier + notebooks (public flight)
    runs-on: ubuntu-latest
    # Nightly, on tags, or when asked - the flight download is ~450 MB.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg
      - name: Install package + notebook deps
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest nbclient nbformat ipykernel matplotlib
          pip install "AlfsPy[torch,embree] @ git+https://github.com/bambi-eco/alfs_py.git@v3.0.0"
      - name: Restore cached public flight
        id: flight-cache
        uses: actions/cache@v4
        with:
          path: .test-data
          # Bump the suffix to force a fresh download (e.g. new dataset version).
          key: bambi-public-flight-v1
      - name: Slow tier + notebooks
        env:
          BAMBI_TEST_DATA: ${{ github.workspace }}/.test-data
          ALFS_ENGINE: torch
          ALFS_RAYCASTER: embree
        run: pytest -m "slow or notebook" -ra
